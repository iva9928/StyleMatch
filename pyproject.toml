[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "StyleMatch"
version = "0.1.0"
description = "StyleMatch — Virtual Wardrobe & Outfit Planner (university project starter)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["stylematch*"]
